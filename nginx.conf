proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

upstream nextjs {
  server 0.0.0.0:12007;
  keepalive 2;
}

upstream backend {
  server 0.0.0.0:12009;
  keepalive 2;
}

server {
  listen 12008;
  # server_name mcp-platform-dev.amd.com;
  server_name _;

  location /mcp/gateway/_next/webpack-hmr {
    proxy_pass http://nextjs/_next/webpack-hmr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade"; 
  } 

  location /mcp/gateway/_next/static/ {
    rewrite ^/mcp/gateway/_next/static/(.*)$ /$1 break;
    root /app/apps/frontend/.next/static;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri $uri/ =404;
  } 

  location /en/__nextjs_source-map {
    proxy_pass http://nextjs/__nextjs_source-map;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade"; 
  } 

