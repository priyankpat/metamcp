  location /mcp/gateway/service/ {
    proxy_pass http://nextjs/mcp/gateway/service/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Register optimizations
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    
    # HTTP/1.1 with proper connection handling
    proxy_set_header Connection '';
    proxy_http_version 1.1;
  }

  # # Redirect /mcp/gateway to /mcp/gateway/en/mcp-servers (default page)
  location = /mcp/gateway {
    return 301 $scheme://$host/mcp/gateway/en/mcp-servers;
  }

  # # Redirect /en/ and /zh/ to /mcp/gateway/en/ and /mcp/gateway/zh/
  # location ~ ^/(en|zh)/(.*)$ {
  #   return 301 /mcp/gateway/$1/$2;
  # }

  # # Redirect /en and /zh (without trailing slash) to /mcp/gateway/en/ and /mcp/gateway/zh/
  # location ~ ^/(en|zh)$ {
  #   return 301 /mcp/gateway/$1/;
  # }

  location /mcp/gateway {
    proxy_pass http://nextjs;  # Frontend
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # SSE-specific optimizations
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;  # 24 hours for long-lived SSE connections
    proxy_send_timeout 86400s;
    
    # HTTP/1.1 with proper connection handling for SSE
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    
    # Additional headers for better SSE support
    proxy_set_header Cache-Control 'no-cache';
    proxy_set_header X-Accel-Buffering 'no';
  }

  # Catch-all for root domain requests (backwards compatibility)
  location / {
    proxy_pass http://nextjs;  # Frontend
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # SSE-specific optimizations
    proxy_buffering off;
